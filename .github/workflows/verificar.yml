name: Verificar Serralheria Serrano
on:
  push:
    branches: [modernizacao-segura]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: |
          test -s index.html
          test -s style.css
          test -s manifest.webmanifest
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
